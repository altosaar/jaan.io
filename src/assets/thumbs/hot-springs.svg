<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 732 736">
  <title>Hot springs: three wisps of steam rising from a basin of water</title>
  <!-- The mark for "Wanna Sauna?" on /writing, and the art on its generated
       share card.

       IT IS THE UNICODE CHARACTER ITSELF: U+2668 HOT SPRINGS, the outline
       lifted from Noto Sans Symbols 2 Regular (v2.008), which is Google's
       reference face for the Miscellaneous Symbols block and is licensed under
       the SIL Open Font License 1.1. The `d` below is that glyph's own path
       data, untouched. It replaced a hand drawing of the same idea, which was
       recognisable but was not the character: the canonical symbol is three
       tapering wisps over an elliptical basin seen in perspective, not
       squiggles over a flat dish.

       WHY AN OUTLINE AND NOT THE CHARACTER OR THE EMOJI. Every mark in this
       folder is one weight of black on transparency, because
       src/components/IndexMark.astro paints it as a MASK in whatever colour the
       row is wearing and scripts/gen-og-cards.mjs inverts it onto the card's
       black. The character set as text would be drawn by whichever font the
       reader's machine happened to reach for, and the emoji presentation of it
       carries colour that survives neither operation. Geometry is the only form
       of the symbol that behaves like the other eight.

       Two mechanical notes, both learned the hard way:

       THE COMMENT STARTS AFTER THE ROOT TAG. Sharp sniffs the format from a
       file's first bytes, so an SVG whose first bytes open a comment rather
       than the svg element is "unsupported image format" and gen-og-cards dies
       on it. A comment here may not contain a double hyphen either, which is
       why this one has none.

       THE viewBox IS THE INK BOX. Every mark is contained inside a fixed square
       (IndexMark) and any transparent margin baked into the frame is margin
       inside that square, so a mark drawn with slack reads smaller than its
       neighbours. This is the glyph's own bounding box, 51,14 to 783,722 in the
       font's 1000 unit em, moved to the origin: the transform below is what
       does the moving, and it also flips the y axis, since font outlines are
       drawn upwards from the baseline and SVG counts downwards. -->
  <g transform="translate(-51, 722) scale(1, -1)">
    <path fill="#000" d="M378 127Q389 168 394.5 193.5Q400 219 402 236.5Q404 254 404 271Q404 332 368 395Q332 458 332 499Q332 540 351 585Q370 630 398 667.5Q426 705 451 722L461 719Q385 604 385 528Q385 486 413 426Q441 364 441 309Q441 256 428 213Q415 170 387 127ZM245 126Q254 158 260.5 179.5Q267 201 268 212Q271 236 271 257Q271 286 264 315Q257 344 242 372Q212 429 212 470Q212 507 226 546Q240 585 262 618.5Q284 652 307 672L317 670Q292 630 276.5 584Q261 538 261 503Q261 484 267.5 458.5Q274 433 285 403Q308 342 308 291Q308 245 296.5 207Q285 169 255 126ZM503 126Q512 158 517.5 179.5Q523 201 525 212Q527 224 528 235.5Q529 247 529 257Q529 315 500 372Q470 431 470 470Q470 508 485 547.5Q500 587 522 620.5Q544 654 565 672L575 670Q550 629 534.5 583Q519 537 519 503Q519 484 524.5 458.5Q530 433 542 403Q566 343 566 291Q566 245 554 206.5Q542 168 513 126ZM417 -14Q247 -14 149 31.5Q51 77 51 162Q51 207 76 239.5Q101 272 145.5 289.5Q190 307 246 307L246 286Q192 280 156.5 251Q121 222 121 180Q121 129 202 100Q283 71 417 71Q485 71 539 78Q593 85 633 100Q713 130 713 180Q713 222 677.5 251Q642 280 588 286L588 307Q674 307 728.5 268Q783 229 783 162Q783 106 738.5 66.5Q694 27 612 6.5Q530 -14 417 -14Z" />
  </g>
</svg>
