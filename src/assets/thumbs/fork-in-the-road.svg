<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <title>A signpost pointing both ways, above a road that forks in two</title>
  <!-- The mark for "The Gab Lab" on /writing, and the art on its generated share
       card.

       IT IS A DETAIL OF THE ARTICLE'S OWN THIRD FIGURE. That drawing puts two
       people either side of this fork — one sitting beside it scratching their
       head, one already running down the right-hand branch — and illustrates
       ambivalence, which is the thing "make sense of messiness" is for. The
       mark keeps the fork and the signpost and drops the figures: at 80px a
       person is four strokes and a smudge, while a road splitting under a
       blank signpost still reads as a choice with nothing written on it.

       TWO EDITS TO THE EXPORT, EVERY TIME IT IS REDRAWN. Neither is tidiness
       and neither survives a re-export, so both have to be made again:

       1. NO XML PROLOG. scripts/gen-og-cards.mjs paints the ink onto this file
          by rewriting its root tag, anchored at the start of the string
          (`/^<svg\b[^>]*>/`). A `<?xml …?>` declaration in front — which is
          what the export arrives with — slides the root tag off position 0,
          the replace silently matches nothing, and the fill is never applied:
          the paths keep CSS's initial black and the card ships black on black.
          Both other SVGs in this directory open on `<svg` for the same reason.

       2. THE STROKE IS currentColor, NOT #000. The signpost is drawn as a
          stroked line rather than as filled geometry — 8px, which is what
          carries it at 80px beside a road that is solid black shape — and a
          stroke does not inherit the root's fill. So the card script's one
          `fill` on the root reaches the road and not the post. Exported as
          `stroke:#000` it renders black on the card's black ground: checked,
          and the card came out as bare road with no signpost at all.
          `currentColor` is the hook gen-og-cards.mjs substitutes (the same one
          the /visualizations marks use); on the page it resolves to black,
          which is irrelevant there because IndexMark uses this file as a MASK
          and a mask reads alpha, not colour.

       THE VIEWBOX IS THE ARTWORK'S OWN, and the ink very nearly fills it: x
       19–394, y 5–409 in a 400 box. The road runs ~9 units past the bottom and
       the viewport clips it flat, which is the road carrying on towards the
       viewer rather than stopping — leave it. The margin left over on the
       other three sides is 1–5%, nothing next to the 27–65% frames the rule in
       src/content.config.ts was written for, and keeping the box square keeps
       this mark square in a column of square marks. -->
  <defs>
    <style>
      .signpost {
        stroke: currentColor;
        stroke-miterlimit: 10;
        stroke-width: 8px;
      }
    </style>
  </defs>
