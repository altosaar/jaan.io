# Polls the newsletter's health endpoint and tells a human when it goes red.
#
# WHY THIS EXISTS. functions/api/subscribe.ts answers 500 on an unexpected
# failure and tries to alert — but the alert goes to ntfy.sh, which rejects
# every publish from a Cloudflare Worker on the free tier (README, Newsletter →
# Alerting). So a broken signup form is currently silent. CI cannot cover this:
# CI runs at push time and a runtime 500 happens weeks later, on infrastructure
# CI has long since stopped watching.
#
# WHAT IT ACTUALLY CATCHES. GET /api/health runs `SELECT 1` against D1, so a red
# result means the Function did not deploy, the DB binding is gone, or D1 is
# refusing queries (most often the daily free-tier quota, which resets at 00:00
# UTC). That is every sustained cause of a 500. What it CANNOT see is a one-off
# 500 while D1 is otherwise healthy — that costs one signup, and catching it is
# what the in-code alert was for.
#
# WHAT IT IS NOT. GitHub's scheduler is best-effort and runs late under load, so
# this is roughly 15-minute resolution, not 10 — fine for "the form has been
# broken for a while", wrong for anything needing minutes. It also shares a
# failure domain with nothing else here, which is the point: it runs on GitHub
# and watches Cloudflare, so it still reports when Cloudflare is the problem.
# It cannot report when GITHUB is the problem, which is the argument for a
# third-party monitor as well.
#
# HEADS UP: GitHub disables scheduled workflows on a repo with no pushes for 60
# days, and re-enabling is a button in the Actions tab. A quiet repo is exactly
# when this matters most, so if commits stop, check that this is still enabled.
name: Health

on:
  schedule:
    # Every 10 minutes. Cheap: a curl and no checkout, so a run is a few seconds.
    - cron: "*/10 * * * *"
  # So it can be run by hand from the Actions tab — which is also how it was
  # tested, since waiting ten minutes to find out whether a monitor works is a
  # good way to ship one that does not.
  workflow_dispatch:

permissions:
  contents: read
  issues: write # opens/closes the notice below; nothing else writes

# A slow run must never overlap the next tick and double-report.
concurrency:
  group: health
  cancel-in-progress: false

env:
  # Slash-less on purpose: public/_redirects ends with a `/*/ → /:splat` 301, so
  # a trailing slash here would measure the redirect instead of the endpoint.
  #
  # jaan.io, not jaan-io.pages.dev: since the cutover this is the hostname
  # visitors reach the form on, so it is the one worth knowing is up. It also
  # covers strictly more — the custom domain, its certificate and the DNS record
  # in front of Pages are all in the path here and none of them are on the
  # pages.dev URL, so a broken domain now shows up as a red check rather than as
  # signups quietly stopping.
  HEALTH_URL: https://jaan.io/api/health
  TITLE: "Newsletter health check is failing"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      # Three attempts, spread out. One failed request is a blip — a dropped
      # packet, a cold edge, GitHub's own network — and opening an issue for it
      # trains the reader to ignore the issues. Three failures a minute apart is
      # an outage.
      - name: Probe /api/health
        id: probe
        run: |
          for attempt in 1 2 3; do
            code=$(curl -sS -m 15 -o /dev/null -w '%{http_code}' "$HEALTH_URL" || echo 000)
            echo "attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "status=up" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [ "$attempt" -lt 3 ] && sleep 30
          done
          echo "status=down" >> "$GITHUB_OUTPUT"
          echo "last=$code" >> "$GITHUB_OUTPUT"

      # ASSIGNED AND @-MENTIONED ON PURPOSE, and this is the part that makes the
      # difference between an alert and a log entry. Watching a repo produces
      # "all activity" notifications, which GitHub's default email preference
      # does NOT send — they land in the web inbox and nowhere else, which is
      # how the first version of this went unnoticed. An assignment and a
      # mention are "participating" notifications, which are emailed by default
      # and survive the owner unwatching the repo later.
      - name: Open or update the notice
        if: steps.probe.outputs.status == 'down'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LAST: ${{ steps.probe.outputs.last }}
        run: |
          body="@$OWNER — \`$HEALTH_URL\` answered **HTTP $LAST** three times in a row, so
          **the newsletter signup form is probably not collecting anything.** The
          rest of the site is static and is unaffected.

          - This run: $RUN_URL

          The endpoint runs \`SELECT 1\` against D1, so a red result means one of:

          1. **The daily D1 quota is exhausted.** Resets at 00:00 UTC. Most likely
             cause if it recovers on its own.
          2. **The \`DB\` binding is missing.** Check \`wrangler.toml\` — bindings
             there REPLACE anything set in the dashboard, so a binding added in the
             dashboard disappears on the next deploy.
          3. **The Functions did not deploy.** \`npx wrangler pages deployment list
             --project-name=jaan-io\` and check the newest one.

          This issue closes itself on the next green run."
          existing=$(gh issue list --state open --search "in:title $TITLE" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body" --assignee "$OWNER"
          fi

      # Self-resetting. Without this the notice stays open after a five-minute
      # quota blip and the next real outage looks like the same old issue.
      - name: Close the notice on recovery
        if: steps.probe.outputs.status == 'up'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --state open --search "in:title $TITLE" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "@$OWNER — recovered. \`$HEALTH_URL\` is answering 200 again. $RUN_URL"
          fi
